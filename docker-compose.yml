services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: bss-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bss_db}
      POSTGRES_USER: ${DB_USERNAME:-bss_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?La variable DB_PASSWORD est obligatoire}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - bss_postgres_donnees:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-bss_user} -d ${DB_NAME:-bss_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bss_postgres_donnees: